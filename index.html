/* PIN hashing (SHA-256) so raw PINs are never stored in the database */
async function hashPin(pin){
  try{
    const enc = new TextEncoder().encode(pin);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    console.error('hashPin failed, falling back to plain (less secure):', e);
    return 'plain:' + pin;
  }
}

/* Thin wrapper mimicking the old window.storage API, now backed by real
   Firestore collections: users/{id}, meta/levels, and localStorage for the
   "remember this device" pointer. Progress has its own dedicated functions
   below (fetchProgress / markMemorized / adminReviewLevel) so security rules
   can tell participant writes and admin writes apart. */
window.storage = {
  async get(key, shared){
    if (key === 'my-user-id'){
      let v = null;
      try{ v = localStorage.getItem('my-user-id'); }catch(e){}
      if (v === null) throw new Error('not-found: ' + key);
      return { key, value: v, shared: false };
    }
    if (key === 'levels-config'){
      const snap = await getDoc(doc(db, 'meta', 'levels'));
      if (!snap.exists()) throw new Error('not-found: ' + key);
      return { key, value: JSON.stringify(snap.data().list), shared: true };
    }
    if (key.startsWith('users:')){
      const userId = key.slice('users:'.length);
      const snap = await getDoc(doc(db, 'users', userId));
      if (!snap.exists()) throw new Error('not-found: ' + key);
      return { key, value: JSON.stringify(snap.data()), shared: true };
    }
    throw new Error('unknown key: ' + key);
  },
  async set(key, value, shared){
    if (key === 'my-user-id'){
      try{ localStorage.setItem('my-user-id', value); }catch(e){}
      return { key, value, shared: false };
    }
    if (key === 'levels-config'){
      await setDoc(doc(db, 'meta', 'levels'), { list: JSON.parse(value) });
      return { key, value, shared: true };
    }
    if (key.startsWith('users:')){
      const userId = key.slice('users:'.length);
      await setDoc(doc(db, 'users', userId), JSON.parse(value));
      return { key, value, shared: true };
    }
    throw new Error('unknown key: ' + key);
  },
  async list(prefix, shared){
    if (prefix === 'users:'){
      const snap = await getDocs(collection(db, 'users'));
      const keys = [];
      snap.forEach(d => keys.push('users:' + d.id));
      return { keys, prefix, shared: true };
    }
    throw new Error('unknown prefix: ' + prefix);
  }
};

/* ---------- Progress (per-level subcollection: progress/{userId}/levels/{levelId}) ---------- */
async function fetchProgress(userId){
  const snap = await getDocs(collection(db, 'progress', userId, 'levels'));
  const levels = {};
  snap.forEach(d => { levels[d.id] = d.data(); });
  return { levels };
}
async function markMemorized(userId, levelId){
  const ref = doc(db, 'progress', userId, 'levels', String(levelId));
  const snap = await getDoc(ref);
  if (!snap.exists()){
    await setDoc(ref, { memorized: true, reviewed: false, points: 0, memorizedAt: serverTimestamp() });
  } else {
    await updateDoc(ref, { memorized: true, memorizedAt: serverTimestamp() });
  }
}
async function adminReviewLevel(userId, levelId, points){
  const ref = doc(db, 'progress', userId, 'levels', String(levelId));
  await setDoc(ref, { memorized: true, reviewed: true, points });
}
async function fetchPendingReviews(){
  const q = query(collectionGroup(db, 'levels'), where('memorized','==',true), where('reviewed','==',false));
  const snap = await getDocs(q);
  const items = [];
  snap.forEach(d => {
    const userId = d.ref.parent.parent.id;
    const data = d.data();
    items.push({ userId, levelId: Number(d.id), memorizedAt: data.memorizedAt || null });
  });
  items.sort((a,b) => {
    const ta = (a.memorizedAt && a.memorizedAt.toMillis) ? a.memorizedAt.toMillis() : 0;
    const tb = (b.memorizedAt && b.memorizedAt.toMillis) ? b.memorizedAt.toMillis() : 0;
    return ta - tb;
  });
  return items;
}
async function refreshPendingCount(){
  try{
    const items = await fetchPendingReviews();
    state.pendingCount = items.length;
  }catch(e){
    console.error('refreshPendingCount failed:', e);
  }
}

/* ---------- Levels config (admin-managed) ---------- */
async function loadLevels(){
  try{
    if (typeof window.storage === 'undefined') throw new Error('no-storage');
    const r = await window.storage.get('levels-config', true);
    if (r && r.value){
      LEVELS = JSON.parse(r.value);
      return;
    }
    LEVELS = DEFAULT_LEVELS.slice();
    await window.storage.set('levels-config', JSON.stringify(LEVELS), true);
  }catch(e){
    console.error('loadLevels failed, using defaults in-memory:', e);
    LEVELS = DEFAULT_LEVELS.slice();
  }
}
async function saveLevels(){
  try{
    await window.storage.set('levels-config', JSON.stringify(LEVELS), true);
  }catch(e){
    console.error('saveLevels failed:', e);
  }
}

function emptyProgress(){
  const levels = {};
  LEVELS.forEach(l => levels[l.id] = { memorized: false, reviewed: false, points: 0 });
  return { levels };
}
function ensureProgressShape(progress){
  LEVELS.forEach(l => { if (!progress.levels[l.id]) progress.levels[l.id] = { memorized:false, reviewed:false, points:0 }; });
  return progress;
}
function totalPoints(progress){
  let t = 0;
  LEVELS.forEach(l => { const lv = progress.levels[l.id]; if (lv) t += (lv.points||0); });
  return t;
}
function maxPointsAll(){ return LEVELS.reduce((s,l) => s + (Number(l.points)||0), 0); }
function levelStatus(progress, id){
  const lv = progress.levels[id];
  if (lv.reviewed) return 'done';
  const idx = LEVELS.findIndex(l => l.id === id);
  if (idx === 0) return lv.memorized ? 'pending' : 'current';
  const prevLevel = LEVELS[idx-1];
  const prev = progress.levels[prevLevel.id];
  if (!prev || !prev.reviewed) return 'locked';
  return lv.memorized ? 'pending' : 'current';
}

/* ---------- Boot / user session ---------- */
async function boot(){
  await loadLevels();
  if (window.location.hash === '#admin'){
    state.viaAdminLink = true;
    state.screen = 'admin-login';
    render();
    return;
  }
  try{
    const ptr = await window.storage.get('my-user-id', false);
    if (ptr && ptr.value){
      await loadUser(ptr.value);
      return;
    }
  }catch(e){}
  state.screen = 'register';
  render();
}
async function loadUser(userId){
  try{
    const u = await window.storage.get('users:' + userId, true);
    state.user = u ? JSON.parse(u.value) : null;
    state.progress = ensureProgressShape(await fetchProgress(userId));
    state.userId = userId;
    state.screen = 'path';
  }catch(e){
    state.screen = 'register';
  }
  render();
}
async function safeGet(key, shared){
  try{ const r = await window.storage.get(key, shared); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}

async function registerUser(phone, fields){
  const btn = document.getElementById('reg-submit');
  if (btn){ btn.disabled = true; btn.textContent = 'جاري الحفظ...'; }
  const userId = phone.replace(/\D/g,'') || ('u' + Date.now());
  const pinHash = await hashPin(fields.pin);
  const user = Object.assign({ phone, registeredAt: new Date().toISOString() }, fields, { pinHash });
  delete user.pin;
  if (user.photo && user.photo.length > 300000){
    console.warn('photo too large even after compression, dropping it');
    user.photo = null;
  }
  try{
    const existing = await safeGet('users:' + userId, true);
    if (existing){
      const existingProgress = await fetchProgress(userId);
      try{ await window.storage.set('my-user-id', userId, false); }catch(e2){}
      state.user = existing;
      state.progress = ensureProgressShape(existingProgress);
      state.userId = userId;
      state.screen = 'path';
      render();
      return;
    }
    await window.storage.set('users:' + userId, JSON.stringify(user), true);
    await window.storage.set('my-user-id', userId, false);
    state.user = user;
    state.progress = emptyProgress();
    state.userId = userId;
    state.screen = 'path';
    render();
  }catch(e){
    console.error('registration error, continuing without persistence:', e);
    state.user = user;
    state.progress = emptyProgress();
    state.userId = userId;
    state.storageDisabled = true;
    state.storageError = (e && e.message) ? e.message : String(e);
    state.screen = 'path';
    render();
  }
}

/* ---------- Render dispatcher ---------- */
function render(){
  const app = document.getElementById('app');
  if (state.screen === 'loading'){ app.innerHTML = `<div class="empty">جاري التحميل...</div>`; return; }
  if (state.screen === 'register'){ app.innerHTML = renderRegister(); attachRegisterEvents(); return; }
  if (state.screen === 'login'){ app.innerHTML = renderLogin(); attachLoginEvents(); return; }
  if (state.screen === 'path'){ app.innerHTML = renderPath(); attachPathEvents(); return; }
  if (state.screen === 'level'){ app.innerHTML = renderLevel(); attachLevelEvents(); return; }
  if (state.screen === 'admin-login'){ app.innerHTML = renderAdminLogin(); attachAdminLoginEvents(); return; }
  if (state.screen === 'admin-list'){ app.innerHTML = renderAdminList(); attachAdminListEvents(); return; }
  if (state.screen === 'admin-pending'){ app.innerHTML = renderAdminPending(); attachAdminPendingEvents(); return; }
  if (state.screen === 'admin-user'){ app.innerHTML = renderAdminUser(); attachAdminUserEvents(); return; }
  if (state.screen === 'admin-levels'){ app.innerHTML = renderAdminLevels(); attachAdminLevelsEvents(); return; }
}

  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'المتسابقين.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderAdminList(){
  const filterText = (state.adminFilter || '').trim();
  const filtered = !filterText ? (state.allUsers||[]) : (state.allUsers||[]).filter(u =>
    (u.user.name||'').includes(filterText) || (u.user.phone||'').includes(filterText) || (u.user.country||'').includes(filterText)
  );
  const body = (!filtered || filtered.length === 0)
    ? `<div class="empty">لا يوجد نتائج</div>`
    : filtered.map(u => `
        <div class="user-row" data-uid="${u.userId}">
          <div class="nm">${u.user.name}</div>
          <div class="ph">${u.user.country ? u.user.country + ' — ' : ''}${u.user.phone}</div>
        </div>
      `).join('');
  const countryCounts = {};
  (state.allUsers||[]).forEach(u => { const c = u.user.country || 'غير محدد'; countryCounts[c] = (countryCounts[c]||0)+1; });
  const countryStats = Object.entries(countryCounts).map(([c,n]) => `${c}: ${n}`).join(' &nbsp;•&nbsp; ');
  return `
    ${state.viaAdminLink ? `<div class="brand"><div class="seal">🔑</div><h1>لوحة المشرف</h1><p>رحلة الحفظ — إدارة عن بُعد</p></div>` : ''}
    <div class="screen">
      ${state.viaAdminLink ? '' : '<div class="back-row"><button id="back-path3">← رجوع</button></div>'}
      <button class="btn btn-green" id="go-pending" style="margin-bottom:16px; position:relative;">
        بانتظار التسميع
        ${state.pendingCount ? `<span style="background:#8B4A3B; color:#fff; border-radius:20px; padding:2px 10px; margin-right:8px; font-size:.8rem;">${state.pendingCount}</span>` : ''}
      </button>
      <div class="btn-row" style="margin-bottom:12px;">
        <button class="btn btn-outline" id="go-manage-levels">إدارة المستويات</button>
        <button class="btn btn-outline" id="refresh-users">تحديث</button>
      </div>
      <div class="btn-row" style="margin-bottom:20px;">
        <button class="btn btn-outline" id="export-csv">تصدير Excel/CSV</button>
        <button class="btn btn-danger" id="admin-logout">تسجيل خروج</button>
      </div>
      <div class="stats-bar" style="flex-direction:column; align-items:flex-start; gap:6px;">
        <div class="who">إجمالي المسجلين: ${(state.allUsers||[]).length}</div>
        <div class="hint" style="margin:0;">${countryStats || 'مفيش بيانات دول لسه'}</div>
      </div>
      <div class="field" style="margin-top:16px;"><input id="admin-search" placeholder="دور بالاسم / الرقم / الدولة..." value="${filterText}"></div>
      <div class="section-title">المستخدمون المسجلون</div>
      ${body}
    </div>
  `;
}
function attachAdminListEvents(){
  const backBtn = document.getElementById('back-path3');
  if (backBtn) backBtn.onclick = () => { state.screen = state.user ? 'path' : 'register'; render(); };
  document.getElementById('go-manage-levels').onclick = () => { state.editingLevelId = null; state.screen = 'admin-levels'; render(); };
  document.getElementById('go-pending').onclick = async () => {
    state.pendingItems = undefined;
    state.screen = 'admin-pending';
    render();
  };
  document.getElementById('refresh-users').onclick = async () => {
    const btn = document.getElementById('refresh-users');
    btn.disabled = true; btn.textContent = 'جاري التحديث...';
    await loadAllUsers();
    await refreshPendingCount();
    render();
  };
  document.getElementById('export-csv').onclick = () => exportUsersCsv();
  document.getElementById('admin-logout').onclick = async () => {
    await adminSignOut();
    state.adminUnlocked = false;
    state.screen = state.user ? 'path' : 'register';
    render();
  };
  const searchInput = document.getElementById('admin-search');
  searchInput.oninput = () => {
    state.adminFilter = searchInput.value;
    render();
    const fresh = document.getElementById('admin-search');
    if (fresh){ fresh.focus(); fresh.setSelectionRange(fresh.value.length, fresh.value.length); }
  };
  document.querySelectorAll('.user-row').forEach(row => {
    row.onclick = async () => {
      const base = state.allUsers.find(u => u.userId === row.dataset.uid);
      state.adminUser = { userId: base.userId, user: base.user, progress: ensureProgressShape(await fetchProgress(base.userId)) };
      state.screen = 'admin-user';
      render();
    };
  });
}

/* ---------- Admin: pending reviews (everyone waiting to be heard) ---------- */
function renderAdminPending(){
  const items = state.pendingItems || [];
  const body = items.length === 0
    ? `<div class="empty">مفيش حد بانتظار التسميع دلوقتي 🎉</div>`
    : items.map((it, idx) => {
        const level = LEVELS.find(l => l.id === it.levelId);
        const userRec = (state.allUsers||[]).find(u => u.userId === it.userId);
        const name = userRec ? userRec.user.name : it.userId;
        const phone = userRec ? userRec.user.phone : '';
        return `
          <div class="user-row" data-uid="${it.userId}">
            <div class="lvl-top">
              <div class="nm">${idx+1}. ${name}</div>
              <span class="lvl-status st-current">الدور ${idx+1}</span>
            </div>
            <div class="ph">${phone}</div>
            <div class="prog">جاهز يتسمّع في: ${level ? level.title : ('مستوى #' + it.levelId)}</div>
          </div>
        `;
      }).join('');
  return `
    <div class="screen">
      <div class="back-row"><button id="back-admin-list4">← رجوع</button></div>
      <div class="section-title">بانتظار التسميع (${items.length})</div>
      ${body}
    </div>
  `;
}
function attachAdminPendingEvents(){
  document.getElementById('back-admin-list4').onclick = async () => {
    await refreshPendingCount();
    state.screen = 'admin-list';
    render();
  };
  if (state.pendingItems === undefined){
    if (!state.allUsers || state.allUsers.length === 0){
      loadAllUsers().then(loadPending);
    } else {
      loadPending();
    }
  }
  async function loadPending(){
    try{
      state.pendingItems = await fetchPendingReviews();
    }catch(e){
      console.error('fetchPendingReviews failed:', e);
      state.pendingItems = [];
    }
    if (state.screen === 'admin-pending') render();
  }
  document.querySelectorAll('.user-row').forEach(row => {
    row.onclick = async () => {
      const base = state.allUsers.find(u => u.userId === row.dataset.uid);
      if (!base) return;
      state.adminUser = { userId: base.userId, user: base.user, progress: ensureProgressShape(await fetchProgress(base.userId)) };
      state.screen = 'admin-user';
      render();
    };
  });
}

function renderAdminUser(){
  const au = state.adminUser;
  const rows = LEVELS.map(l => {
    const lv = au.progress.levels[l.id] || { memorized:false, reviewed:false, points:0 };
    let statusText = 'لم يبدأ بعد';
    if (lv.reviewed) statusText = 'تمت المراجعة ✅';
    else if (lv.memorized) statusText = 'حفظ وبانتظار التسميع';
    return `
      <div class="admin-level">
        <div class="t">${l.title} <span style="color:var(--muted); font-weight:400;">(${l.ref||''})</span></div>
        <div class="s">${statusText}</div>
        ${!lv.reviewed ? `
          <div class="row2">
            <div class="field">
              <label>الدرجات بعد التسميع (من ${l.points})</label>
              <input type="number" min="0" max="${l.points}" id="recite-${l.id}" value="${lv.points||0}">
            </div>
          </div>
          <div style="height:10px;"></div>
          <button class="btn btn-green" data-review="${l.id}">حفظ الدرجة وتأكيد المراجعة</button>
        ` : `<div style="color:var(--gold-bright); font-size:.8rem;">النقاط: ${lv.points}/${l.points}</div>`}
      </div>
    `;
  }).join('');
  return `
    <div class="screen">
      <div class="back-row"><button id="back-admin-list">← رجوع لكل المستخدمين</button></div>
      <div class="section-title">${au.user.name} — ${au.user.phone}</div>
      <div class="admin-level">
        ${au.user.gender ? `<b>النوع:</b> ${au.user.gender} &nbsp; ` : ''}
        ${au.user.age ? `<b>السن:</b> ${au.user.age} &nbsp; ` : ''}
        ${au.user.country ? `<b>الدولة:</b> ${au.user.country}` : ''}<br>
        ${au.user.email ? `<b>الإيميل:</b> ${au.user.email} &nbsp; ` : ''}
        ${au.user.job ? `<b>الوظيفة:</b> ${au.user.job}` : ''}<br>
        ${au.user.affiliationName ? `<b>${au.user.affiliationType || 'تابع لـ'}:</b> ${au.user.affiliationName}` : ''}
      </div>
      ${rows}
    </div>
  `;
}
function attachAdminUserEvents(){
  document.getElementById('back-admin-list').onclick = async () => { await refreshPendingCount(); state.screen = 'admin-list'; render(); };
  document.querySelectorAll('[data-review]').forEach(btn => {
    btn.onclick = async () => {
      const lid = Number(btn.dataset.review);
      const level = LEVELS.find(l => l.id === lid);
      const input = document.getElementById('recite-' + lid);
      let pts = Number(input.value);
      if (isNaN(pts) || pts < 0) pts = 0;
      if (pts > level.points) pts = level.points;
      btn.disabled = true; btn.textContent = 'جاري الحفظ...';
      const au = state.adminUser;
      try{
        await adminReviewLevel(au.userId, lid, pts);
        au.progress.levels[lid] = { memorized:true, reviewed:true, points:pts };
      }catch(e){
        console.error('admin save failed:', e);
        alert('فشل حفظ الدرجة — تأكد إنك لسه مسجّل دخول كمشرف');
      }
      render();
    };
  });
}

/* ---------- Admin: manage levels ---------- */
function renderAdminLevels(){
  const editing = state.editingLevelId ? LEVELS.find(l => l.id === state.editingLevelId) : null;
  const list = LEVELS.map(l => `
    <div class="cfg-level">
      <div class="t">${l.title}</div>
      <div class="r">${l.ref || ''}</div>
      <div class="c">${l.content}</div>
      <div class="meta">النقاط: ${l.points} &nbsp; | &nbsp; الهدية: ${l.gift || '—'}</div>
      <div class="btn-row">
        <button class="btn btn-outline btn-small" data-edit="${l.id}">تعديل</button>
        <button class="btn btn-danger btn-small" data-delete="${l.id}">حذف</button>
      </div>
    </div>
  `).join('');
  return `
    <div class="screen">
      <div class="back-row"><button id="back-admin-list2">← رجوع</button></div>
      <div class="section-title">المستويات الحالية</div>
      ${list || '<div class="empty">لسه مفيش مستويات</div>'}

      <div class="section-title">${editing ? 'تعديل مستوى' : 'إضافة مستوى جديد'}</div>
      <div class="field"><label>عنوان المستوى</label><input id="lvl-title" value="${editing ? editing.title.replace(/"/g,'&quot;') : ''}" placeholder="مثال: الرب راعيّ"></div>
      <div class="field"><label>المرجع / الوصف (اختياري)</label><input id="lvl-ref" value="${editing ? (editing.ref||'').replace(/"/g,'&quot;') : ''}" placeholder="مثال: مزمور 23: 1-2"></div>
      <div class="field"><label>النص المطلوب حفظه</label><textarea id="lvl-content" placeholder="اكتب النص هنا">${editing ? editing.content : ''}</textarea></div>
      <div class="field"><label>عدد نقاط المستوى</label><input id="lvl-points" type="number" min="1" value="${editing ? editing.points : 100}"></div>
      <div class="field"><label>هدية المستوى عند اكتماله</label><input id="lvl-gift" value="${editing ? (editing.gift||'').replace(/"/g,'&quot;') : ''}" placeholder="مثال: كتاب، ميدالية..."></div>

      <div class="btn-row">
        <button class="btn btn-gold" id="lvl-save">${editing ? 'حفظ التعديل' : 'إضافة المستوى'}</button>
        ${editing ? '<button class="btn btn-outline" id="lvl-cancel">إلغاء</button>' : ''}
      </div>
      <div id="lvl-error" class="error"></div>
    </div>
  `;
}
function attachAdminLevelsEvents(){
  document.getElementById('back-admin-list2').onclick = () => { state.editingLevelId = null; state.screen = 'admin-list'; render(); };

  document.querySelectorAll('[data-edit]').forEach(btn => {
    btn.onclick = () => { state.editingLevelId = Number(btn.dataset.edit); render(); };
  });
  document.querySelectorAll('[data-delete]').forEach(btn => {
    btn.onclick = async () => {
      const id = Number(btn.dataset.delete);
      LEVELS = LEVELS.filter(l => l.id !== id);
      await saveLevels();
      if (state.editingLevelId === id) state.editingLevelId = null;
      render();
    };
  });

  const cancelBtn = document.getElementById('lvl-cancel');
  if (cancelBtn) cancelBtn.onclick = () => { state.editingLevelId = null; render(); };

  document.getElementById('lvl-save').onclick = async () => {
    const title = document.getElementById('lvl-title').value.trim();
    const ref = document.getElementById('lvl-ref').value.trim();
    const content = document.getElementById('lvl-content').value.trim();
    const points = Number(document.getElementById('lvl-points').value);
    const gift = document.getElementById('lvl-gift').value.trim();
    const err = document.getElementById('lvl-error');

    if (!title || !content){ err.textContent = 'من فضلك اكتب العنوان والنص المطلوب حفظه'; return; }
    if (!points || points <= 0){ err.textContent = 'من فضلك حدد عدد نقاط صحيح'; return; }
    err.textContent = '';

    if (state.editingLevelId){
      const lvl = LEVELS.find(l => l.id === state.editingLevelId);
      lvl.title = title; lvl.ref = ref; lvl.content = content; lvl.points = points; lvl.gift = gift;
    } else {
      const newId = LEVELS.length ? Math.max(...LEVELS.map(l => l.id)) + 1 : 1;
      LEVELS.push({ id: newId, title, ref, content, points, gift });
    }
    await saveLevels();
    state.editingLevelId = null;
    render();
  };
}

boot();
</script>
